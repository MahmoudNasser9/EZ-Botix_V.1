<!DOCTYPE html>
<html>
<head>
    <title>EZ-BOTIX Professional Workstation</title>
    <!-- Vendored locally so the editor opens without internet access -->
    <script src="lib/blockly/blockly.min.js"></script>
    <script src="lib/blockly/python_compressed.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Custom Notification Box -->
    <div id="customAlert">Notification Message</div>

    <!-- Top navigation bar -->
    <div class="top-navbar">
        <div class="brand-section">
            <span class="brand-icon">🤖</span>
            <span class="brand-name">EZ-BOTIX</span>
        </div>
        <div class="action-bar">
            <button id="loadBtn">📂 Open</button>
            <button id="saveBtn">💾 Save</button>

            <select id="portSelect"><option value="">Scanning...</option></select>
            <button id="refreshBtn">🔄 Scan</button>
            <button id="connectBtn">🔌 Connect Robot</button>

            <button id="runBtn">▶️ Test Live</button>
            <button id="flashBtn">💾 Flash to Robot</button>
            <button id="stopBtn">🛑 Stop</button>
            <button id="disconnectBtn">🔌 Disconnect</button>
            <span id="statusLabel" class="status">Disconnected</span>
        </div>
    </div>

    <!-- Coding canvas with watermark wrapper -->
    <div id="workspaceWrapper">
        <div id="watermark"></div>
        <div id="blocklyDiv"></div>
    </div>

    <!--
        Block definitions: each file below owns one hardware category and
        registers itself with EZBOTIX (registry.js). To add a new hardware
        feature, add its own js/blocks/<feature>.js file and one <script>
        tag here - no other file needs to change.
    -->
    <script src="js/registry.js"></script>
    <script src="js/blocks/lights.js"></script>
    <script src="js/blocks/motion.js"></script>
    <script src="js/blocks/inputs.js"></script>
    <script src="js/blocks/utility.js"></script>
    <script src="js/blocks/oled.js"></script>
    <script src="js/blocks/buzzer.js"></script>

    <script src="js/toolbox.js"></script>
    <script src="js/api-bridge.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
